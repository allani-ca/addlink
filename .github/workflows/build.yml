name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false
      - name: Build and package
        env:
          CGO_ENABLED: '0'
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist/linux dist/windows
          GOOS=linux GOARCH=amd64 go build -trimpath -o dist/linux/addlink addlink.go
          GOOS=windows GOARCH=amd64 go build -trimpath -o dist/windows/addlink.exe addlink.go
          cp README.md LICENSE.txt LICENSE-APACHE.txt LICENSE-MIT.txt dist/linux/
          cp README.md LICENSE.txt LICENSE-APACHE.txt LICENSE-MIT.txt dist/windows/
          tar -czf "dist/addlink-${VERSION}-linux-amd64.tar.gz" -C dist/linux .
          (cd dist/windows && zip -q "../addlink-${VERSION}-windows-amd64.zip" *)
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
          fail_on_unmatched_files: true